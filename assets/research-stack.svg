<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="880" height="300" rx="18" fill="url(#bg)"/>
  <text x="40" y="58" fill="#f8fafc" font-size="30" font-weight="700">research-stack</text>
  <text x="40" y="86" fill="#94a3b8" font-size="15">one routed path for agent web &amp; docs research</text>

  <!-- question -->
  <rect x="40" y="140" width="150" height="70" rx="12" fill="#334155" stroke="#475569"/>
  <text x="115" y="170" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">question</text>
  <text x="115" y="192" fill="#cbd5e1" font-size="12" text-anchor="middle">needs outside facts</text>

  <!-- router -->
  <rect x="250" y="130" width="130" height="90" rx="12" fill="#1d4ed8" stroke="#3b82f6"/>
  <text x="315" y="165" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">route</text>
  <text x="315" y="185" fill="#dbeafe" font-size="12" text-anchor="middle">bound · refund</text>
  <text x="315" y="203" fill="#dbeafe" font-size="12" text-anchor="middle">deliver</text>

  <line x1="190" y1="175" x2="248" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- tools -->
  <g>
    <rect x="460" y="112" width="180" height="46" rx="10" fill="#065f46" stroke="#10b981"/>
    <text x="550" y="132" fill="#ecfdf5" font-size="13" font-weight="700" text-anchor="middle">context7</text>
    <text x="550" y="149" fill="#a7f3d0" font-size="11" text-anchor="middle">library &amp; SDK docs</text>

    <rect x="460" y="168" width="180" height="46" rx="10" fill="#7c2d12" stroke="#f97316"/>
    <text x="550" y="188" fill="#fff7ed" font-size="13" font-weight="700" text-anchor="middle">tavily</text>
    <text x="550" y="205" fill="#fed7aa" font-size="11" text-anchor="middle">web search &amp; synthesis</text>

    <rect x="460" y="224" width="180" height="46" rx="10" fill="#581c87" stroke="#a855f7"/>
    <text x="550" y="244" fill="#faf5ff" font-size="13" font-weight="700" text-anchor="middle">firecrawl</text>
    <text x="550" y="261" fill="#e9d5ff" font-size="11" text-anchor="middle">page extraction &amp; crawl</text>
  </g>
  <path d="M380 175 C420 175 420 135 458 135" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M380 175 L458 191" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M380 175 C420 175 420 247 458 247" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- output -->
  <rect x="700" y="140" width="140" height="70" rx="12" fill="#334155" stroke="#475569"/>
  <text x="770" y="170" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">cited answer</text>
  <text x="770" y="192" fill="#cbd5e1" font-size="12" text-anchor="middle">or research file</text>
  <path d="M640 135 C670 135 670 175 698 175" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M640 191 L698 177" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M640 247 C670 247 670 175 698 175" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
</svg>
